[project]
name = "network-anomaly-detector"
version = "0.1.0"
description = "PySpark data generation and event-stream feature engineering at scale, a two-stage anomaly detector (robust z-score + Isolation Forest), statistical hypothesis testing, and a rule-based root-cause and remediation investigation agent"
requires-python = ">=3.9"
dependencies = [
    "pyspark>=3.5",
    "pandas>=2.0,<3.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "pyarrow>=18.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
